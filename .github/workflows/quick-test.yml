name: Quick Test

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-test.txt
    
    - name: Run quick tests
      run: |
        pytest -x --tb=short -q
    
    - name: Check coverage threshold
      run: |
        pytest --cov=grplot --cov-report=term --cov-fail-under=15
